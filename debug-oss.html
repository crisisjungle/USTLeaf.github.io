<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aliyun OSS Diagnostic</title>
    <style>
        body {
            font-family: sans-serif;
            padding: 20px;
            max-width: 800px;
            margin: 0 auto;
        }

        .log {
            background: #f0f0f0;
            padding: 15px;
            border: 1px solid #ccc;
            font-family: monospace;
            white-space: pre-wrap;
            margin-top: 10px;
            min-height: 200px;
            border-radius: 4px;
        }

        .error {
            color: #d32f2f;
            font-weight: bold;
        }

        .success {
            color: #2e7d32;
            font-weight: bold;
        }

        .info {
            color: #1976d2;
        }

        button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
        }

        button:hover {
            background: #0056b3;
        }

        h1 {
            margin-bottom: 10px;
        }
    </style>
    <!-- Aliyun OSS SDK -->
    <script src="https://gosspublic.alicdn.com/aliyun-oss-sdk-6.18.0.min.js"></script>
</head>

<body>
    <h1>阿里云 OSS 连接诊断</h1>
    <p>点击下方按钮开始测试 OSS 连接配置。请将测试结果截图发给我。</p>
    <button onclick="startTest()">🚀 开始测试</button>
    <div id="output" class="log">等待测试...</div>

    <!-- Configuration -->
    <script src="js/oss-client.js?v=1"></script>
    <script src="js/oss-public-config.js?v=1"></script>

    <script>
        async function startTest() {
            const logEl = document.getElementById('output');
            logEl.innerHTML = '';

            const log = (msg, type = 'info') => {
                const div = document.createElement('div');
                div.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
                div.className = type;
                logEl.appendChild(div);
                console.log(msg); // Also log to console
            };

            log('开始诊断...', 'info');

            // 0. Environment Check
            log(`Current Browser Origin: ${window.location.origin}`, 'info');
            if (window.location.protocol === 'file:') {
                log('WARNING: 您正在直接打开文件。请使用 VS Code "Open with Live Server" 以获得 http://127.0.0.1 环境。', 'error');
            }

            // 1. Check SDK
            if (typeof OSS === 'undefined') {
                log('FAIL: Aliyun OSS SDK 未加载。可能是 CDN 网络问题。', 'error');
                return;
            }
            log('PASS: OSS SDK 已加载。', 'success');

            // 2. Check Config
            if (!window.USTLeafOSS || typeof window.USTLeafOSS.createClient !== 'function') {
                log('FAIL: USTLeafOSS helper 未定义。请检查 js/oss-client.js 是否加载成功。', 'error');
                return;
            }
            const publicConfig = window.USTLeafOSS.getConfig('public');
            if (!publicConfig) {
                log('FAIL: public 角色的 OSS 配置未定义。', 'error');
                return;
            }
            log(`PASS: 找到 public 配置。Region: ${publicConfig.region}, Bucket: ${publicConfig.bucket}`, 'success');

            // 3. Init Client
            let client;
            try {
                client = window.USTLeafOSS.createClient('public');
                if (!client) throw new Error(window.USTLeafOSS.getConfigErrorMessage('public'));

                log('PASS: OSS 客户端初始化成功。', 'success');
            } catch (e) {
                log('FAIL: 客户端初始化失败: ' + e.message, 'error');
                return;
            }

            // 4. Test List (CORS Check)
            log('正在尝试连接 OSS (List Objects)...', 'info');
            try {
                const result = await client.list({ 'max-keys': 1 });
                log('PASS: 连接成功！OSS 响应正常。', 'success');
                log(`状态码: ${result.res.status}`, 'info');
                log(`发现文件数: ${result.objects ? result.objects.length : 0}`, 'info');
            } catch (e) {
                log('FAIL: 连接失败。', 'error');
                log('错误名称: ' + e.name, 'error');
                log('错误信息: ' + e.message, 'error');

                log('\n🔍 --- 深度诊断 ---', 'info');

                // 1. Check Origin Mismatch
                const currentOrigin = window.location.origin;
                const configOrigin = "http://127.0.0.1:5500";
                const configOrigin2 = "https://ustleaf.github.io";

                if (!currentOrigin.includes('127.0.0.1') && !currentOrigin.includes('ustleaf.github.io')) {
                    log(`⚠️ 域名不匹配警告: 您当前的网址是 ${currentOrigin}，但阿里云配置里只允许了 ${configOrigin} 和 ${configOrigin2}。\n如果您正在用 localhost 访问，请改用 127.0.0.1，或者把 localhost 也加到阿里云跨域设置里。`, 'error');
                } else if (e.message.includes('belong to you') || e.code === 'AccessDenied' || e.name === 'AccessDeniedError') {
                    log('\n🛑 严重错误 [账户不匹配 / 权限不足]:', 'error');
                    log(`错误信息: ${e.message}`, 'error');
                    log('这通常意味着：**您填写的 AccessKey (LTAI...) 不属于创建 Bucket 的那个账号！**', 'error');
                    log('1. 请确认您是否拥有多个阿里云账号？不能混用 A 账号的 Key 去操作 B 账号的 Bucket。', 'error');
                    log('2. 或者，该 RAM 用户确实完全没有权限。', 'error');
                    log('👉 解决办法：最好直接用当前登录控制台的这个账号，创建一个新的 RAM 用户并生成新的 AK/SK，确保都在同一个账号下。', 'error');
                } else if (e.name.includes('403') || e.message.includes('403')) {
                    log('\n🛑 诊断建议 [403 Forbidden]:', 'error');
                    log('请检查以下几点：', 'info');
                    log('1. 您提供的 AccessKeyId (LTAI...) 对应的用户，是否已被授予 "AliyunOSSFullAccess" 权限？', 'info');
                    log('   (如果没有权限，也会报网络错误/403，看起来像 CORS 问题，但其实是没权限)', 'info');
                    log('2. 请登录阿里云 RAM 访问控制台 -> 用户 -> 找到该用户 -> 权限管理 -> 添加权限 -> 搜索 "AliyunOSSFullAccess" -> 确定。', 'info');
                } else {
                    log('✅ 域名匹配检查通过 (当前域名在允许列表中)。', 'success');

                    // 2. RAM Permissions (The most likely suspect if CORS is correct)
                    log('\n🛑 极大概率是 RAM 用户权限问题！', 'error');
                    log('请检查以下几点：', 'info');
                    log('1. 您提供的 AccessKeyId (LTAI...) 对应的用户，是否已被授予 "AliyunOSSFullAccess" 权限？', 'info');
                    log('   (如果没有权限，也会报网络错误/403，看起来像 CORS 问题，但其实是没权限)', 'info');
                    log('2. 请登录阿里云 RAM 访问控制台 -> 用户 -> 找到该用户 -> 权限管理 -> 添加权限 -> 搜索 "AliyunOSSFullAccess" -> 确定。', 'info');
                }
            }
        }
    </script>
</body>

</html>
