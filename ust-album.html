<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <title>科大相册 - 校园植物展示网站</title>
    <link rel="icon" href="logo.png">
    <link rel="stylesheet" href="styles.css?v=3">
    <link rel="stylesheet" href="css/ust-album.css?v=3">
    <link rel="stylesheet" href="css/upload.css?v=3">
</head>

<body data-page="album">
    <header data-site-header></header>

    <!-- Hero Section (Carousel) -->
    <section class="album-hero" id="album-hero">
        <div class="carousel-container" id="hero-carousel">
            <!-- Default Placeholder to prevent black screen -->
            <div class="carousel-item active">
                <img src="campus.jpeg" alt="科大校园">
                <div class="overlay">
                    <div class="hero-credit">
                        <p>By UST Leaf</p>
                    </div>
                </div>
            </div>
        </div>
        <!-- Static Title Overlay -->
        <div class="hero-static-content">
            <h1>科大校园共享相册</h1>
            <p class="hero-subtitle">方寸镜头，万千自然</p>
        </div>
        <div class="scroll-down">
            <a href="#album-gallery"><span>﹀</span></a>
        </div>
    </section>

    <!-- Gallery Section (Waterfall) -->
    <section class="album-gallery" id="album-gallery">
        <div class="gallery-header">
            <h2>最新上传</h2>
            <p>来自师生们的精彩瞬间</p>
        </div>

        <div class="masonry-grid" id="masonry-grid">
            <!-- Grid items injected by JS -->
            <div class="masonry-column"></div>
            <div class="masonry-column"></div>
            <div class="masonry-column"></div>
        </div>

        <div class="loading-state" id="gallery-loading">
            <div class="spinner"></div> 加载中...
        </div>

        <div class="album-footer-quote" id="album-footer-quote"
            style="display:none; text-align: center; padding: 40px 20px; color: #888; cursor: pointer; user-select: none;">
            未完待续，等你执笔。
        </div>
    </section>

    <!-- Lightbox -->
    <div id="lightbox" class="lightbox">
        <span class="lightbox-close">&times;</span>
        <div class="lightbox-content">
            <img class="lightbox-image" id="lightbox-img" src="">
            <div class="lightbox-info">
                <span id="lb-date" class="lb-date-top"></span>

                <h3 id="lb-photographer"></h3>
                <div class="lb-meta-list">
                    <div class="lb-meta-row">
                        <span class="lb-meta-label">位置</span>
                        <p id="lb-location"></p>
                    </div>
                    <div class="lb-meta-row" id="lb-plant-guess-row">
                        <span class="lb-meta-label">猜测植物</span>
                        <p id="lb-plant-guess"></p>
                    </div>
                </div>
                <div class="lb-desc-container">
                    <p class="lb-section-title">补充说明</p>
                    <p id="lb-desc"></p>
                </div>
            </div>
        </div>
    </div>


    <!-- Upload FAB (Reused) -->
    <div class="fab-container">
        <button id="upload-fab" class="fab-button" title="上传校园植物照片">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path>
                <circle cx="12" cy="13" r="4"></circle>
            </svg>
        </button>
    </div>

    <!-- Upload Modal (Reused) -->
    <div id="upload-modal" class="modal-overlay" style="display: none;">
        <div class="modal-container">
            <div class="modal-header">
                <h2>嘿，你拍到了什么好玩的？</h2>
                <button id="close-modal" class="close-button">&times;</button>
            </div>

            <div class="modal-body">
                <div class="upload-section" id="section-user-info">
                    <h3>1. 投稿信息</h3>
                    <div class="form-group">
                        <label for="contributor-name">昵称</label>
                        <input type="text" id="contributor-name" placeholder="想署名的话再填写">
                        <p class="field-hint">可选，不填会以“匿名同学”展示。</p>
                    </div>
                    <div class="form-group">
                        <label for="location-text">拍摄位置 <span class="required">*</span></label>
                        <textarea id="location-text" placeholder="例如：红鸟广场北门旁，靠近巴士站一侧的行道树" required></textarea>
                        <p class="field-hint">请尽量写清楚建筑、路径、地标或方位，方便管理员核对。</p>
                    </div>
                    <div class="form-group">
                        <label for="plant-guess">你觉得它是什么植物？</label>
                        <input type="text" id="plant-guess" placeholder="例如：凤凰木、细叶榕">
                    </div>
                    <div class="form-group">
                        <label for="submission-note">补充说明</label>
                        <textarea id="submission-note" placeholder="可以写拍摄时间、你观察到的特征，或任何想补充的话。"></textarea>
                    </div>
                </div>

                <div class="upload-section" id="section-images">
                    <h3>2. 选择照片 (最多50张)</h3>
                    <div class="file-drop-area" id="drop-area">
                        <div class="drop-area-content">
                            <span class="fake-btn">选择文件</span>
                            <span class="file-msg">或将文件拖到这里</span>
                        </div>
                        <p class="drop-area-sub">同一次提交默认视为同一地点；如果是不同地点，请分开提交。</p>
                        <input class="file-input" type="file" id="file-input" multiple accept="image/*">
                    </div>

                    <div id="preview-grid" class="preview-grid"></div>
                </div>

                <div id="upload-progress-container" style="display: none;">
                    <div class="progress-bar-bg">
                        <div id="upload-progress-bar" class="progress-bar-fill" style="width: 0%"></div>
                    </div>
                    <p id="upload-status-text">准备提交...</p>
                </div>
            </div>

            <div class="modal-footer">
                <button id="btn-upload" class="primary-button">提交审核</button>
            </div>
        </div>
    </div>

    <!-- Dependencies -->
    <!-- Dependencies with Fallback/Different CDN -->
    <!-- Dependencies with Fallback/Different CDN -->
    <!-- Aliyun OSS SDK -->
    <script src="https://gosspublic.alicdn.com/aliyun-oss-sdk-6.18.0.min.js"></script>
    <!-- Image Compression (Staticfile CDN for China) -->
    <script src="https://cdn.staticfile.org/browser-image-compression/2.0.2/browser-image-compression.min.js"></script>

    <!-- Scripts -->
    <script src="js/oss-client.js?v=1"></script>
    <script src="js/oss-public-config.js?v=1"></script>
    <script src="js/oss-student-config.js?v=1"></script>
    <script src="js/shared-album-utils.js?v=1"></script>
    <script src="js/upload.js?v=3"></script>
    <script src="js/upload-ui.js?v=3"></script>
    <script src="js/ust-album.js?v=3"></script>
    <script src="js/site-content.js"></script>
    <script src="js/site-shell.js"></script>
    <script src="scripts.js"></script>

</body>

</html>
